name: Editorial publish job

on:
  workflow_call:
    inputs:
      release:
        type: string
        required: true
      package_sha256:
        type: string
        required: true
      package_version:
        type: string
        required: true
      manifest_sha256:
        type: string
      receipt_sha256:
        type: string
      verified_on:
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Verify release inputs before owner approval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          ENABLED: ${{ vars.EDITORIAL_CI_ENABLED }}
          RELEASE: ${{ inputs.release }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
          VERIFIED_ON: ${{ inputs.verified_on }}
        run: |
          case "$RELEASE" in
            manifest)
              [ -z "$RECEIPT_SHA256$VERIFIED_ON" ] || exit 1
              python3 -B deploy/ci/check-editorial-inputs.py release-manifest "$PACKAGE_SHA256" "$PACKAGE_VERSION" "$MANIFEST_SHA256"
              exit ;;
            education) action=publish ;;
            household) action=publish-household ;;
            *) exit 1 ;;
          esac
          [ -z "$MANIFEST_SHA256" ] || exit 1
          python3 -B deploy/ci/check-editorial-inputs.py "$action" "$PACKAGE_SHA256" "$PACKAGE_VERSION" "$RECEIPT_SHA256" "$VERIFIED_ON"
  publish:
    name: Publish reviewed guides
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_EDITORIAL_PUBLISH_ROLE_ARN }}
          role-session-name: lifeinuk-editorial-publish-${{ github.run_id }}
          aws-region: eu-west-2
          role-duration-seconds: 1800
      - env:
          INSTANCE_ID: ${{ vars.BACKEND_INSTANCE_ID }}
          SSM_DOCUMENT: LifeInUK-PublishEducationGuides
          RELEASE: ${{ inputs.release }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
          VERIFIED_ON: ${{ inputs.verified_on }}
        run: |
          case "$RELEASE" in
            manifest)
              deploy/ci/ssm-release.sh publish release=manifest packageSha256="$PACKAGE_SHA256" packageVersion="$PACKAGE_VERSION" manifestSha256="$MANIFEST_SHA256"
              exit ;;
            education) args=() ;;
            household) args=(release=household) ;;
            *) exit 1 ;;
          esac
          deploy/ci/ssm-release.sh publish packageSha256="$PACKAGE_SHA256" packageVersion="$PACKAGE_VERSION" receiptSha256="$RECEIPT_SHA256" verifiedOn="$VERIFIED_ON" "${args[@]}"
