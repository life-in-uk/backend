# Backend production deployment (docs/ci-cd.md). Manual only; the deploy job
# waits for the owner's approval on the "production" environment.
#
#   deploy:   ships the image that CI built and tested for a commit on main
#             (no rebuild), through S3 and the SSM document
#             LifeInUK-BackendRelease, which runs deploy/scripts/release.sh on
#             the instance (backup, switch, health, automatic return to the
#             previous image on failure).
#   rollback: back to the previous image kept on the server.
#   status:   what is running, the Flyway version and the rollback target.
#
# Pending Flyway migrations block the deploy until the owner lists exactly
# those versions in approve_migrations (and, for flagged statements, ticks
# destructive_migrations_reviewed). The database is never reset, reseeded or
# restored by this workflow.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy, rollback or status"
        type: choice
        options: [deploy, rollback, status]
        default: deploy
      ref:
        description: "deploy: commit SHA on main (blank = current main)"
        required: false
        default: ""
      approve_migrations:
        description: "deploy: pending Flyway versions you reviewed, e.g. 16,17 (none if there are none)"
        required: false
        default: "none"
      destructive_migrations_reviewed:
        description: "deploy: I reviewed the flagged statements of the pending migrations and the rollback impact"
        type: boolean
        default: false
      allow_newer_schema:
        description: "rollback: the previous image may run on a schema with newer migrations (checked it is compatible)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  production:
    uses: ./.github/workflows/deploy-production-job.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      action: ${{ inputs.action }}
      ref: ${{ inputs.ref }}
      approve_migrations: ${{ inputs.approve_migrations }}
      destructive_migrations_reviewed: ${{ inputs.destructive_migrations_reviewed }}
      allow_newer_schema: ${{ inputs.allow_newer_schema }}
