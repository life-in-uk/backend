name: Publish reviewed guides

on:
  workflow_dispatch:
    inputs:
      release:
        description: Use manifest for new releases; other choices resume legacy releases
        type: choice
        options: [manifest, education, household]
        default: manifest
      package_sha256:
        description: SHA-256 of the approved package ZIP
        type: string
        required: true
      package_version:
        description: Private S3 package object version ID
        type: string
        required: true
      manifest_sha256:
        description: SHA-256 of EDITORIAL-MANIFEST.json (manifest releases)
        type: string
      receipt_sha256:
        description: SHA-256 of the verified private import receipt (legacy only)
        type: string
      verified_on:
        description: Date of local content review (legacy only, YYYY-MM-DD)
        type: string

permissions:
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/editorial-publish-job.yml
    permissions:
      contents: read
      id-token: write
    with:
      release: ${{ inputs.release }}
      package_sha256: ${{ inputs.package_sha256 }}
      package_version: ${{ inputs.package_version }}
      manifest_sha256: ${{ inputs.manifest_sha256 }}
      receipt_sha256: ${{ inputs.receipt_sha256 }}
      verified_on: ${{ inputs.verified_on }}
