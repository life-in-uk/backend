name: Publish reviewed guides

on:
  workflow_dispatch:
    inputs:
      package_sha256:
        description: SHA-256 of the approved Education package ZIP
        type: string
        required: true
      package_version:
        description: Private S3 package object version ID
        type: string
        required: true
      receipt_sha256:
        description: SHA-256 of the verified private import receipt
        type: string
        required: true
      verified_on:
        description: Date of local content review (YYYY-MM-DD)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/editorial-publish-job.yml
    permissions:
      contents: read
      id-token: write
    with:
      package_sha256: ${{ inputs.package_sha256 }}
      package_version: ${{ inputs.package_version }}
      receipt_sha256: ${{ inputs.receipt_sha256 }}
      verified_on: ${{ inputs.verified_on }}
