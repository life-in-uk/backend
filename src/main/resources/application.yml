spring:
  application:
    name: life-in-uk-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/life_in_uk}
    username: ${DB_USERNAME:life_in_uk_app}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

life-in-uk:
  acquisition:
    national-highways:
      # Must equal the canonical v2.0 production base; any other value fails startup.
      roads-base-url: ${NATIONAL_HIGHWAYS_ROADS_BASE_URL:https://api.data.nationalhighways.co.uk/roads/v2.0}
      # Secret: environment only. Never commit, persist, log or place it in a URL.
      api-key: ${NATIONAL_HIGHWAYS_API_KEY:}
  places:
    os-names:
      # Must equal the canonical OS Names v1 base; any other value fails startup.
      base-url: ${OS_NAMES_BASE_URL:https://api.os.uk/search/names/v1}
      # Secret: environment only. Never commit, persist, log or place it in a URL (sent as the 'key' header).
      api-key: ${OS_NAMES_API_KEY:}
  rail:
    base-url: ${NATIONAL_RAIL_API_BASE_URL:https://api1.raildata.org.uk/1010-live-arrival-board-arr/LDBWS}
    api-key: ${NATIONAL_RAIL_API_KEY:}
  rail-departures:
    base-url: ${NATIONAL_RAIL_DEPARTURES_BASE_URL:}
    api-key: ${NATIONAL_RAIL_DEPARTURES_API_KEY:}
  rail-rate-limit:
    # Per application instance, fixed one-minute windows; checked before any provider request.
    per-client-per-minute: ${RAIL_RATE_LIMIT_PER_CLIENT_PER_MINUTE:6}
    aggregate-per-minute: ${RAIL_RATE_LIMIT_AGGREGATE_PER_MINUTE:60}
  travel-refresh:
    # OFF by default. Enabling unattended provider polling is an owner operational decision
    # (qualification, evidence retention and cost). See README "Travel Current State refresh".
    underground:
      enabled: ${TRAVEL_REFRESH_UNDERGROUND_ENABLED:false}
      interval: ${TRAVEL_REFRESH_UNDERGROUND_INTERVAL:PT2M}
      max-runs: ${TRAVEL_REFRESH_UNDERGROUND_MAX_RUNS:0}
    roads:
      enabled: ${TRAVEL_REFRESH_ROADS_ENABLED:false}
      interval: ${TRAVEL_REFRESH_ROADS_INTERVAL:PT10M}
      max-runs: ${TRAVEL_REFRESH_ROADS_MAX_RUNS:0}
