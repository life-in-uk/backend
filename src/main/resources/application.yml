spring:
  application:
    name: life-in-uk-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/life_in_uk}
    username: ${DB_USERNAME:life_in_uk_app}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true