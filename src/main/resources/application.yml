spring:
  application:
    name: life-in-uk-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/life_in_uk}
    username: ${DB_USERNAME:life_in_uk_app}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

life-in-uk:
  acquisition:
    national-highways:
      # Must equal the canonical v2.0 production base; any other value fails startup.
      roads-base-url: ${NATIONAL_HIGHWAYS_ROADS_BASE_URL:https://api.data.nationalhighways.co.uk/roads/v2.0}
      # Secret: environment only. Never commit, persist, log or place it in a URL.
      api-key: ${NATIONAL_HIGHWAYS_API_KEY:}
  places:
    os-names:
      # Must equal the canonical OS Names v1 base; any other value fails startup.
      base-url: ${OS_NAMES_BASE_URL:https://api.os.uk/search/names/v1}
      # Secret: environment only. Never commit, persist, log or place it in a URL (sent as the 'key' header).
      api-key: ${OS_NAMES_API_KEY:}
  weather:
    met-office:
      # Must equal the canonical Global spot v0 base; any other value fails startup.
      base-url: ${MET_OFFICE_BASE_URL:https://data.hub.api.metoffice.gov.uk/sitespecific/v0}
      # Secret: environment only. Never commit, persist, log or place it in a URL (sent as the 'apikey' header).
      # Absent: /api/weather/current answers WEATHER_NOT_CONFIGURED and nothing calls the Met Office.
      api-key: ${MET_OFFICE_API_KEY:}
  rail:
    base-url: ${NATIONAL_RAIL_API_BASE_URL:https://api1.raildata.org.uk/1010-live-arrival-board-arr/LDBWS}
    api-key: ${NATIONAL_RAIL_API_KEY:}
  rail-departures:
    base-url: ${NATIONAL_RAIL_DEPARTURES_BASE_URL:}
    api-key: ${NATIONAL_RAIL_DEPARTURES_API_KEY:}
  rail-access:
    # OFF by default: no Rail endpoint contacts RDM, even if Rail credentials are present.
    # Enable only after the RDM Schedule 2 policy, licensing and rate-limit review.
    enabled: ${RAIL_ACCESS_ENABLED:false}
  rail-rate-limit:
    # Per application instance, fixed one-minute windows; checked before any provider request.
    per-client-per-minute: ${RAIL_RATE_LIMIT_PER_CLIENT_PER_MINUTE:6}
    aggregate-per-minute: ${RAIL_RATE_LIMIT_AGGREGATE_PER_MINUTE:60}
  travel-refresh:
    # OFF by default. Enabling unattended provider polling is an owner operational decision
    # (qualification, evidence retention and cost). See README "Travel Current State refresh".
    underground:
      enabled: ${TRAVEL_REFRESH_UNDERGROUND_ENABLED:false}
      interval: ${TRAVEL_REFRESH_UNDERGROUND_INTERVAL:PT10M}
      max-runs: ${TRAVEL_REFRESH_UNDERGROUND_MAX_RUNS:0}
    roads:
      enabled: ${TRAVEL_REFRESH_ROADS_ENABLED:false}
      interval: ${TRAVEL_REFRESH_ROADS_INTERVAL:PT10M}
      max-runs: ${TRAVEL_REFRESH_ROADS_MAX_RUNS:0}
  market-indices:
    # Collector-pushed stock index observations (docs/market-indices.md). Everything is OFF by default:
    # no collector key (POST answers 503), no accepted source, public read disabled (404), no public source.
    # Hashes only, never secrets, each bound to the sources it may write:
    # keyId:sha256hex:source[|source][,keyId:sha256hex:source[|source]] (two keys during rotation).
    collector-keys: ${MARKET_INDICES_COLLECTOR_KEYS:}
    accepted-sources: ${MARKET_INDICES_ACCEPTED_SOURCES:}
    # Requires a display licence for the configured public sources. "mock" can never be public (startup fails).
    public-enabled: ${MARKET_INDICES_PUBLIC_ENABLED:false}
    public-sources: ${MARKET_INDICES_PUBLIC_SOURCES:}
    attribution: ${MARKET_INDICES_ATTRIBUTION:}
    # Bounded: backfill PT1H..P365D; retention P30D..P3650D and at least one day longer than backfill.
    max-backfill: ${MARKET_INDICES_MAX_BACKFILL:P30D}
    retention: ${MARKET_INDICES_RETENTION:P730D}
    # Background retention cadence (PT5M..PT24H); never on the ingestion path.
    retention-interval: ${MARKET_INDICES_RETENTION_INTERVAL:PT1H}
