spring:
  application:
    name: life-in-uk-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/life_in_uk}
    username: ${DB_USERNAME:life_in_uk_app}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

life-in-uk:
  acquisition:
    national-highways:
      # Must equal the canonical v2.0 production base; any other value fails startup.
      roads-base-url: ${NATIONAL_HIGHWAYS_ROADS_BASE_URL:https://api.data.nationalhighways.co.uk/roads/v2.0}
      # Secret: environment only. Never commit, persist, log or place it in a URL.
      api-key: ${NATIONAL_HIGHWAYS_API_KEY:}