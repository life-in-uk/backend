# Owner browser session: same-site, HttpOnly, 30-minute idle timeout.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${EDITORIAL_SESSION_COOKIE_SECURE:false}

# Separate owner-facing passwords; never use machine bearer tokens in the browser.
life-in-uk.editorial.owner-draft-password=${EDITORIAL_OWNER_DRAFT_PASSWORD:}
life-in-uk.editorial.owner-approval-password=${EDITORIAL_OWNER_APPROVAL_PASSWORD:}
life-in-uk.editorial.owner-origins=${EDITORIAL_OWNER_ORIGINS:http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5179,http://localhost:5179}
